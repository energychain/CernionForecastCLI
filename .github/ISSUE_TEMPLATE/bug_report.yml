name: Bug report
description: Report a reproducible CLI bug
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API tokens, real customer data, non-public MSCONS files or private market communication payloads. Use synthetic or redacted examples.
  - type: input
    id: version
    attributes:
      label: CLI version or commit
      description: Output from `cernion-forecast describe` or the git commit SHA.
      placeholder: "0.2.0 / d615298"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Python 3.12.3"
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - day-ahead
        - history
        - enroll
        - train
        - predict
        - resume
        - score
        - acceptance-test
        - e2e
        - batch-history
        - doctor
        - describe
        - other
    validations:
      required: true
  - type: dropdown
    id: input_format
    attributes:
      label: Input format
      options:
        - JSON
        - CSV
        - MSCONS/EDIFACT
        - no input file
        - mixed/other
    validations:
      required: true
  - type: textarea
    id: command_line
    attributes:
      label: Command line
      description: Redact tokens and private paths if needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
      description: Paste the error text after removing secrets and private data.
      render: text
    validations:
      required: true
  - type: textarea
    id: minimal_data
    attributes:
      label: Minimal sanitized reproduction data
      description: Prefer synthetic data. Do not attach real customer data or private MSCONS messages.
      render: json
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checklist
      options:
        - label: I removed API tokens and authorization headers.
          required: true
        - label: I removed or masked customer, meter and market-party identifiers unless they are synthetic.
          required: true
        - label: I am not attaching non-public MSCONS/EDIFACT payloads.
          required: true
